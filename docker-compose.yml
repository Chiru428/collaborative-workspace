# Local full-stack environment:  docker compose up --build
# Requires a .env file next to this one (copy .env.example) that sets JWT_SECRET.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/collaborative-workspace
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (16+ characters) in the .env file next to docker-compose.yml}
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_URL: http://localhost:5000
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  mongo-data:
  uploads:
